<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Ayuda y Preguntas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 700px;
      width: 100%;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #38bdf8;
    }
    .card {
      background-color: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      margin-bottom: 15px;
      font-size: 1rem;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      background-color: #0284c7;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #0369a1;
    }
    .questions-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .question-item {
      background-color: #1e293b;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #38bdf8;
    }
    .question-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .user-name {
      font-weight: bold;
      color: #f1f5f9;
    }
    .question-text {
      font-size: 1.05rem;
      line-height: 1.4;
    }
    .loading {
      text-align: center;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Preguntas y Ayuda</h1>

    <div class="card">
      <form id="qaForm">
        <label for="userName">Tu Nombre / Usuario:</label>
        <input type="text" id="userName" placeholder="Ej: Friman" required>

        <label for="userQuestion">Escribe tu pregunta o duda:</label>
        <textarea id="userQuestion" rows="3" placeholder="¿Cómo funciona esta app?..." required></textarea>

        <button type="submit" id="submitBtn">Publicar Pregunta</button>
      </form>
    </div>

    <h2>Preguntas Recientes</h2>
    <br>
    <div id="questionsContainer" class="questions-list">
      <p class="loading">Cargando preguntas de la base de datos...</p>
    </div>
  </div>

  <!-- Carga del SDK de Firebase desde CDN (Módulos) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      query, 
      orderBy, 
      onSnapshot, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // Configuración con tus claves
    const firebaseConfig = {
      apiKey: "AIzaSyASS8TwFITAbH0GGMTu0p72FNMd2PnLByc",
      authDomain: "friman-apps-qa.firebaseapp.com",
      projectId: "friman-apps-qa",
      storageBucket: "friman-apps-qa.firebasestorage.app",
      messagingSenderId: "996723850226",
      appId: "1:996723850226:web:8c0eee62e6d087fbfac96b",
      measurementId: "G-HPHXHD6CFE"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const questionsRef = collection(db, "preguntas");

    const form = document.getElementById('qaForm');
    const nameInput = document.getElementById('userName');
    const questionInput = document.getElementById('userQuestion');
    const container = document.getElementById('questionsContainer');
    const submitBtn = document.getElementById('submitBtn');

    // 1. Guardar nueva pregunta en Firestore
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = nameInput.value.trim();
      const question = questionInput.value.trim();

      if (!name || !question) return;

      submitBtn.disabled = true;
      submitBtn.innerText = "Publicando...";

      try {
        await addDoc(questionsRef, {
          nombre: name,
          pregunta: question,
          fecha: serverTimestamp()
        });

        // Limpiar campo de pregunta
        questionInput.value = '';
      } catch (error) {
        console.error("Error al guardar la pregunta: ", error);
        alert("Ocurrió un error al enviar la pregunta.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Publicar Pregunta";
      }
    });

    // 2. Escuchar cambios en tiempo real desde Firestore
    const q = query(questionsRef, orderBy("fecha", "desc"));

    onSnapshot(q, (snapshot) => {
      container.innerHTML = '';

      if (snapshot.empty) {
        container.innerHTML = '<p class="loading">No hay preguntas publicadas aún. ¡Sé el primero!</p>';
        return;
      }

      snapshot.forEach((doc) => {
        const data = doc.data();
        const dateFormatted = data.fecha ? new Date(data.fecha.toDate()).toLocaleString() : 'Recién publicado';

        const item = document.createElement('div');
        item.className = 'question-item';
        item.innerHTML = `
          <div class="question-header">
            <span class="user-name">${escapeHTML(data.nombre)}</span>
            <span>${dateFormatted}</span>
          </div>
          <div class="question-text">${escapeHTML(data.pregunta)}</div>
        `;
        container.appendChild(item);
      });
    });

    // Función de seguridad para prevenir HTML malicioso (XSS)
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>
</body>
</html>
